[package]
name = "parley_data"
description = "Unicode data for Parley"
keywords = ["text", "layout"]
categories = ["gui", "graphics"]
edition.workspace = true
version.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["baked"]
baked = []
# Reads the combined table from data serialized by ICU4X's exporters, as from
# a postcard blob through a `BufferProvider`.
serde = ["dep:serde", "icu_collections/serde", "icu_provider/serde"]
# Writes the combined table as data, for exporters such as `icu_provider_export`.
datagen = ["serde", "icu_collections/databake", "icu_provider/export"]

[dependencies]
icu_collections = { workspace = true }
icu_properties = { workspace = true }
icu_provider = { workspace = true }
serde = { workspace = true, optional = true }
yoke = { workspace = true }
zerofrom = { workspace = true }

[dev-dependencies]
icu_properties = { workspace = true, features = ["compiled_data"] }

[lints]
workspace = true
